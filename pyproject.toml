[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "1.0.0+portfolio"
description = "Evidence-backed operational investigations with RAG, LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.6,<1", "alembic>=1.14,<2", "langgraph>=1.0,<2",
  "mcp>=1.20,<2", "openai>=2.0,<3", "httpx>=0.28,<1", "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
opspilot = "opspilot.cli:main"
opspilot-mcp = "opspilot.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a running migrated PostgreSQL/pgvector database"]

